name: Bug report
description: Report a reproducible problem in Aperture
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Aperture. Remove secrets and company content from all output.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Start revision …
        2. Ingest a synthetic …
        3. Search for …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Search, Ingestion, Research agent, Knowledge graph, Integrations, MCP, UI, Deployment, Other]
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
      placeholder: Commit SHA or release tag
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker/Compose version, CPU/RAM, and browser when relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, OAuth payloads, private URLs, and company content.
          required: true
        - label: This is not a security vulnerability.
          required: true
