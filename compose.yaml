name: company-brain

x-app-environment: &app-environment
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  REDUCTO_API_KEY: ${REDUCTO_API_KEY:-}
  COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-lightrag.sql:/docker-entrypoint-initdb.d/10-lightrag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    command: ["--data-dir", "/data", "--api-key", "brain-typesense-local", "--enable-cors", "false"]
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8108/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0.0-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    command: "server -dir=/data -s3 -s3.port=8333 -master.port=9333 -volume.port=8080 -filer.port=8888"
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  lightrag:
    build:
      context: .
      dockerfile: docker/lightrag/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - lightrag-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9621/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      target: bootstrap
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      target: worker
    environment: *app-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment: *app-environment
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok&&r.status!==503)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  evaluation:
    profiles: ["tools"]
    build:
      context: .
      target: evaluation
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  typesense-data:
  valkey-data:
  seaweed-data:
  lightrag-data:
